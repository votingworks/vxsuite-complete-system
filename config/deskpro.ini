; To create a TWAIN log you have to change the entries below.
[Logging]
; Possible levels are:
;   5/off/none = not active (default)
;   4/error = only errors
;   3/warning = errors + warnings
;   2/info = errors + warnings + general informations
;   1/debug = additional debug informations
;   0/trace = additional trace informations
level=5

; Do not change apilevel unless specified by InoTec. (0 is default)
apilevel=0

; Do not change usblevel unless specified by InoTec. (0 is default)
usblevel=0

; Specify log file name. Environment variables like '%PROGRAMDATA%' can be used.
; (%PROGRAMDATA%/InoTec/Logfiles/InoU3.log is default)
FileName=%PROGRAMDATA%/InoTec/Logfiles/InoU3.log

; Specifies if a new log file should be created every day and when it should be
; deleted automatically:
;   off      = only one big log file is created and appended to it
;   on       = a new log file with current date is created every day
;   1,2,3,.. = same as on, but files older then specified days are deleted automatically (14 is default)
DailyLog=14

; Specify a writeable path or leave empty. If a valid path is specified, the API
; will save all received images additionally to this path. For debug purposes only!
; ('ImageStorage=' is default)
ImageStorage=

; Specify a writeable path or leave empty. If a valid path is specified, the API
; will save statistic files at this path.
StatisticsStorage=

; General settings
[General]
; Specify the size of the internal queue for images. Set to 0 for default. (0 is default)
apiqueue=0

; Forces to disable the overwrite counter when this flag is set. Set to 0 for default.
; If this flag is set to 1, the overwrite counter will always be disabled and
; it is not possible to change the counter values via profiles. (0 is default)
ForceOverwriteCounterOff=0

; Specifies if a Not Operational (Noop) Dialog is shown while the scanner is in a
; partial or non operational state
; 0 = Disable dialog
; 1 = Enable dialog (default)
; Attention: Disabling may cause an endless loop or a crash while an error is active and
; a scan shall be performed
EnableNoopDialog=1

; Specifies the machine learning text detection script
; 0 = latin (default): European (latin-style) documents
; 1 = arabic: Arabic documents, also mixed with latin lines
MLDetectionScript=0

; Specifies the credibility threshold for detection
; Below this threshold, the default orientation is taken
; Values 0...100 (default: 10)
MLCredabilityThreshold=10

; Compatibility settings can be changed in the section below.
[Compatibility]
; profilehandling defines the way the driver answers to capabilities on MSG_SET
; while using an internal (not remote) profile:
;   0 = TWRC_FAILURE at all caps except the ones below (default)
;   1 = TWRC_CHECKSTATUS at all caps except the ones below
;   2 = always TWRC_SUCCESS
; Valid Caps:
;   ICAP_XFERMECH, CAP_INDICATORS, CAP_DEVICEEVENT, ICAP_EXTIMAGEINFO,
;   INOCAP_COUNTER_1, INOCAP_COUNTER_2, INOCAP_COUNTER_3, INOCAP_COUNTER_4,
;   INOCAP_SCANNER_PROFILE_GETLIST
profilehandling=0

; Can be used for TWAIN-Applications, which are unable to save profiles by themselves.
; When finishing configuration the returned profile will be saved locally on host pc
; by the driver itself. Upon TWAIN-Driver loading, the profile will be used instead of
; fetching the profile from the scanner.
; When loading TWAIN-Driver, fetch initial profile from:
;   0 = Scanner (default)
;   1 = Host PC
lastprofilehandling=0

; Needed for legacy applications which do not support CAP_CAMERASIDE.
; When CAP_DUPLEXENABLED is set to TRUE, CAP_CAMERASIDE will be set to TWCS_BOTH.
; When set to FALSE, CAP_CAMERASIDE becomes TWCS_TOP.
; This assures that further calls to caps like ICAP_PIXELTYPE work properly. (off is default)
DuplexEnabledControlsCameraSide=off

; Activate when imprinter variables and attributes from SCAMAX M06 (4x2/4x3)
; are used and must be converted. (off is default)
ConvertM06=off

; Activate when imprinter variables and attributes from SCAMAX M03 (4x1) or
; SCAMAX H04 (510/515) are used and must be converted. (off is default)
ConvertM03H04=off

; Activate when imprinter variable and attributes from ISIS M06 (4x2/4x3)
; are used and must be converted. (off is default)
ConvertM06ISIS=off

; Defines the meaning of CAP_XFERCOUNT.
;
;   0 = Behaves like CAP_SHEETCOUNT (default)
;   1 = TWAIN specification behaviour
xfercountsemantics=0

; Specifies the behavior of ICAP_XFERMECH. Using 1, 2, or 3 will set the
; corresponding XFERMECH mode as the default and lock it permanently. Even if
; a MSG_SET attempts to change the value, it will be ignored, and MSG_SET will
; always return TWRC_SUCCESS. A value of 0 or any number other than 1, 2, or 3
; will default to TWSX_NATIVE and follow the standard TWAIN specification
; behavior.
;
;   0 = TWSX_NATIVE (default)
;   1 = TWSX_MEMORY
;   2 = TWSX_FILE
;   3 = TWSX_MEMFILE
xfermechsemantics=0

; Defines the behaviour to reset a capability.
;
;   0 = A reset of a capability sets the value to default (default)
;   1 = TWAIN specification behaviour (explicit reset value)
capresetsemantics=0

; Specify a profile file or leave empty. If a valid file name is specified, the API
; will override all profiles from the driver with this profile. That means that
; all parameters of the scan application are ignored. Instead this fixed profile
; is used. ('OverrideRemoteProfile=' is default)
OverrideRemoteProfile=

; Defines the barcode behavior for ExtImageInfo
; Since Twain 2.5 TWEI_BARCODETEXT2 is available and the behavior of TWEI_BARCODETEXT has changed
; 0 = Legacy behavior (TWAIN spec < 2.5) (default)
; 1 = Since Twain spec 2.5 behavior
barcodeextimageinfosemantics=0

; The section below describes the behaviour of the graphical user interface.
[GUI]
; Activate local GUI on PC, e.g. to use internal scanner profiles. (on is default)
local=off

; Language of local GUI, e.g. sys, cz, de, en, fr, it, pl, ru or sv are possible choices.
; When system language is unsupported, then english will be used by default. (sys is default)
lang=sys

; Show the profile selection area in the InoUI (on, off) (off is default)
showProfileSelection=off

[Profile]

; When the flag is on, all following settings in the profile section will be forced
; to its values which are definied in this file.
;
; !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
; Attention:
; No plausibility checks are performed, so uninformed changes may result in a
; inconsistent profile.
;
; 0 = off (default)
; 1 = on
ForceSettings=0

; 0 = off
; 1 = on (default)
Deskew=1

; 0 = Top Edge First
; 1 = Left Edge First
; 2 = Bottom Edge First
; 3 = Right Edge First (default)
PaperInputOrientation=3

; 0 = Portrait (default)
; 1 = Landscape
OutputImageOrientation=0

; 0  = Maximum Scan Area (default)
; 1  = ISO A3 - 297.0 x 420.0 mm
; 2  = ISO A4 - 210.0 x 297.0 mm
; 3  = ISO A5 - 148.0 x 210.0 mm
; 4  = ISO A6 - 105.0 x 148.0 mm
; 5  = ISO A7 - 74.0 x 105.0 mm
; 6  = ISO B4 - 250.0 x 353.0 mm
; 7  = ISO B5 - 176.0 x 250.0 mm
; 8  = ISO B6 - 125.0 x 176.0 mm
; 9  = ISO B7 - 88.0 x 125.0 mm
; 10 = US LEDGER - 11.0 x 17.0 inch
; 11 = US LEGAL - 8.5 x 14.0 inch
; 12 = US LETTER - 8.5 x 11.0 inch
; 13 = US EXECUTIVE - 7.25 x 10.5 inch
; 14 = US INVOICE - 5.5 x 8.5 inch
; 15 = User Defined Format
FormatSelection=0

; Width between 0 and 3175 (Tenth of a mm). Default is 0.
UserDefinedFormatW=0

; Height between 0 and 99999 (Tenth of a mm). Default is 0.
; The allowed max value depends on the resolution.
; Invalid value may result in a incosistent profile.
UserDefinedFormatH=0

; Value between 0 and 255. Default is 200.
BitonalBrightness=200

; Value between 0 and 255. Default is 30.
BitonalContrast=30

; Value between 0 and 255. Default is 100.
BitonalOutlining=100
